AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Deploys a STUN server (full mode, RFC 5389/8489) on EC2 with two network interfaces each backed by an Elastic IP. An Auto Scaling Group of size 1 provides self-healing. Latency-based Route 53 routing sends clients to the nearest regional deployment.

Parameters:
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for DomainName. The zone must exist before deploying the stack.
  DomainName:
    Type: String
    AllowedPattern: '^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$'
    Description: Fully qualified name of the latency-routed A record, without a trailing dot. It must belong to the zone in HostedZoneId.
  StunServerVersion:
    Type: String
    AllowedPattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    Description: >-
      Version of the stunserver RPM that new instances install, for example
      1.2.20. It has no default: every deploy states the version it ships.
  LatestAl2023AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      SSM public parameter naming the Amazon Linux 2023 AMI. It resolves in
      each region when the StackSet is updated, so every deploy runs on the
      current image.
  StatusPort:
    Type: Number
    Default: 18080
    MinValue: 1024
    MaxValue: 65535
    Description: >-
      TCP port of the status endpoint that Route 53 health-checks. It answers
      only "200 OK" or "503 Service Unavailable".

Resources:

  StunVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "stunserver-vpc-${AWS::Region}"

  StunSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StunVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "stunserver-subnet-${AWS::Region}"

  StunInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "stunserver-igw-${AWS::Region}"

  StunVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref StunVPC
      InternetGatewayId: !Ref StunInternetGateway

  StunRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StunVPC
      Tags:
        - Key: Name
          Value: !Sub "stunserver-rt-${AWS::Region}"

  StunRoute:
    Type: AWS::EC2::Route
    DependsOn: StunVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref StunRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref StunInternetGateway

  StunSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref StunSubnet
      RouteTableId: !Ref StunRouteTable

  StunSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Left exactly as it was: GroupDescription cannot be changed in place, and
      # changing it would replace the group and every network interface in it.
      # It predates the removal of SSH, which is why it still mentions it.
      GroupDescription: "STUN server: UDP 3478/3479 inbound, SSH inbound"
      VpcId: !Ref StunVPC
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 3478
          ToPort: 3478
          CidrIp: 0.0.0.0/0
          Description: STUN primary port UDP
        - IpProtocol: udp
          FromPort: 3479
          ToPort: 3479
          CidrIp: 0.0.0.0/0
          Description: STUN alternate port UDP
        - IpProtocol: tcp
          FromPort: !Ref StatusPort
          ToPort: !Ref StatusPort
          CidrIp: 0.0.0.0/0
          Description: Status endpoint, health-checked by Route 53
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "stunserver-sg-${AWS::Region}"

  StunRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "stunserver-role-${AWS::Region}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StunServerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetArtifactorySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:artifactory/stunserver*"
              - Sid: AssociateEIPs
                Effect: Allow
                Action: ec2:AssociateAddress
                Resource: "*"
              - Sid: DescribeENIs
                Effect: Allow
                Action: ec2:DescribeNetworkInterfaces
                Resource: "*"
              # Lets the instance tell the rolling update it came up (or didn't).
              - Sid: SignalStack
                Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
              # Lets a persistently failing instance ask to be replaced.
              - Sid: ReportInstanceUnhealthy
                Effect: Allow
                Action: autoscaling:SetInstanceHealth
                Resource: !Sub "arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/stunserver-asg-${AWS::Region}"
              - Sid: CreateAndAttachAltEni
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:AttachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:CreateTags
                Resource: "*"

  StunInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "stunserver-profile-${AWS::Region}"
      Roles:
        - !Ref StunRole

  EIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "stunserver-eip1-${AWS::Region}"

  # Asks the instance's own status endpoint, which checks that the server
  # really answers STUN on both addresses and ports. Created or switched only
  # after the ASG has a healthy instance, so a region enters DNS (and a deploy
  # changes the check) only once the new instance serves it.
  StunHealthCheck:
    Type: AWS::Route53::HealthCheck
    DependsOn: StunASG
    Properties:
      HealthCheckConfig:
        IPAddress: !GetAtt EIP1.PublicIp
        Port: !Ref StatusPort
        Type: HTTP
        ResourcePath: /
        RequestInterval: 10
        FailureThreshold: 2
      HealthCheckTags:
        - Key: Name
          Value: !Sub "stunserver-hc-${AWS::Region}"

  EIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "stunserver-eip2-${AWS::Region}"

  StunLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "stunserver-lt-${AWS::Region}"
      LaunchTemplateData:
        InstanceType: t3.small
        ImageId: !Ref LatestAl2023AmiId
        IamInstanceProfile:
          Name: !Ref StunInstanceProfile
        NetworkInterfaces:
          - DeviceIndex: 0
            SubnetId: !Ref StunSubnet
            Groups:
              - !Ref StunSecurityGroup
            DeleteOnTermination: true
            AssociatePublicIpAddress: true
        # Bash variables are written ${!NAME} below, because the whole script
        # goes through Fn::Sub. The CloudFormation ones are ${AWS::Region},
        # ${AWS::StackName}, ${StunServerVersion}, ${StatusPort},
        # ${StunSubnet}, ${StunSecurityGroup} and the EIP allocation IDs.
        UserData:
          Fn::Base64: !Sub |-
            #!/bin/bash
            set -ex

            # ── IMDSv2 token ──────────────────────────────────────────
            TOKEN=$(curl -sXPUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 21600')
            IMDS='http://169.254.169.254/latest/meta-data'
            INSTANCE_ID=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/instance-id")

            # ── Tell CloudFormation how this boot went ────────────────
            # The rolling update waits for this signal. Any failure below signals FAILURE
            # straight away instead of leaving the rollout to time out.
            SIGNALED=false
            signal() {
              aws cloudformation signal-resource --stack-name ${AWS::StackName} --logical-resource-id StunASG --unique-id "$INSTANCE_ID" --status "$1" --region ${AWS::Region} || true
              SIGNALED=true
            }
            trap 'rc=$?; if [ "$SIGNALED" = false ] && [ "$rc" != 0 ]; then signal FAILURE; fi' EXIT

            # ── Install dependencies ──────────────────────────────────
            dnf install -y awscli jq

            # ── Wait for the instance profile's credentials ───────────
            # A fresh instance can run this before they are available.
            for i in $(seq 1 30); do
              aws sts get-caller-identity > /dev/null 2>&1 && break
              sleep 2
            done
            aws sts get-caller-identity > /dev/null

            # ── Retrieve Artifactory credentials from Secrets Manager ─
            # Tracing is off around the secret: xtrace would print it to the console log.
            set +x
            SECRET=$(aws secretsmanager get-secret-value --secret-id artifactory/stunserver --region ${AWS::Region} --query SecretString --output text)
            ARTIFACTORY_USER=$(echo "$SECRET" | jq -r '.username')
            ARTIFACTORY_TOKEN=$(echo "$SECRET" | jq -r '.token')
            unset SECRET

            # ── Configure Artifactory yum repo (root-only: it holds the credential) ─
            umask 077
            cat > /etc/yum.repos.d/artifactory-stunserver.repo << REPO
            [stunserver-rpm-internal]
            name=Stunserver RPM Internal
            baseurl=https://${!ARTIFACTORY_USER}:${!ARTIFACTORY_TOKEN}@artifactory.mitel.com/artifactory/stunserver-rpm-internal/
            enabled=1
            gpgcheck=0
            REPO
            umask 022
            set -x

            # ── Install stunserver (masked to prevent RPM %post auto-start) ─
            # Pinned to this release's version, so a replacement instance never picks up a
            # build nobody has approved.
            systemctl mask stunserver.service
            dnf install -y "stunserver-${StunServerVersion}"
            systemctl unmask stunserver.service

            # ── Resolve ENI0 and its MAC (the only NIC present at boot) ─
            ENI0_ID=''
            MAC0=''
            for MAC in $(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/"); do
              MAC=$(echo "$MAC" | tr -d '/')
              DEV=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/$MAC/device-number")
              ENI=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/$MAC/interface-id")
              if [ "$DEV" = '0' ]; then ENI0_ID=$ENI; MAC0=$MAC; fi
            done
            IP0=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/$MAC0/local-ipv4s" | head -n 1)

            # ── Create and attach the alternate NIC ──────────────────
            # The alternate NIC is not in the launch template because ASG rejects
            # AssociatePublicIpAddress on launch templates with multiple NICs, and the
            # primary NIC needs a public IP at boot so this script itself has internet
            # access (dnf, Secrets Manager, EIP association).
            ENI1_ID=$(aws ec2 create-network-interface --subnet-id ${StunSubnet} --groups ${StunSecurityGroup} --description stunserver-alt-nic --region ${AWS::Region} --query NetworkInterface.NetworkInterfaceId --output text)
            MAC1=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI1_ID" --region ${AWS::Region} --query 'NetworkInterfaces[0].MacAddress' --output text)
            ATTACHMENT_ID=$(aws ec2 attach-network-interface --network-interface-id "$ENI1_ID" --instance-id "$INSTANCE_ID" --device-index 1 --region ${AWS::Region} --query AttachmentId --output text)
            aws ec2 modify-network-interface-attribute --network-interface-id "$ENI1_ID" --attachment AttachmentId=$ATTACHMENT_ID,DeleteOnTermination=true --region ${AWS::Region}

            # ── Resolve the OS-level interface names by MAC (AL2023 uses ─
            # ── predictable names like ens5/ens6, not eth0/eth1) ─────
            systemctl restart nm-cloud-setup.service || true
            IFACE0=''
            IFACE1=''
            for i in $(seq 1 30); do
              for f in /sys/class/net/*/address; do
                IF=$(basename $(dirname "$f"))
                ADDR=$(cat "$f")
                if [ "$ADDR" = "$MAC0" ]; then IFACE0=$IF; fi
                if [ "$ADDR" = "$MAC1" ]; then IFACE1=$IF; fi
              done
              if [ -n "$IFACE0" ] && [ -n "$IFACE1" ]; then break; fi
              sleep 2
            done

            if [ -z "$IFACE0" ] || [ -z "$IFACE1" ]; then
              echo 'ERROR: Timed out resolving OS-level interface names' >&2
              exit 1
            fi

            # ── Associate Elastic IPs ─────────────────────────────────
            aws ec2 associate-address --allocation-id ${EIP1.AllocationId} --network-interface-id "$ENI0_ID" --allow-reassociation --region ${AWS::Region}
            aws ec2 associate-address --allocation-id ${EIP2.AllocationId} --network-interface-id "$ENI1_ID" --allow-reassociation --region ${AWS::Region}

            # ── Wait for both ENIs to have public IPs (max 5 min) ────
            PRIMARY_EIP=''
            ALT_EIP=''
            for i in $(seq 1 30); do
              PRIMARY_EIP=''
              ALT_EIP=''
              for MAC in $(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/"); do
                MAC=$(echo "$MAC" | tr -d '/')
                DEV=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/$MAC/device-number")
                PUB=$(curl -sH "X-aws-ec2-metadata-token: $TOKEN" "$IMDS/network/interfaces/macs/$MAC/public-ipv4s" 2>/dev/null || true)
                if ! echo "$PUB" | grep -qE '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$'; then continue; fi
                if [ "$DEV" = '0' ]; then PRIMARY_EIP=$PUB; fi
                if [ "$DEV" = '1' ]; then ALT_EIP=$PUB; fi
              done
              if [ -n "$PRIMARY_EIP" ] && [ -n "$ALT_EIP" ]; then break; fi
              sleep 10
            done

            if [ -z "$PRIMARY_EIP" ] || [ -z "$ALT_EIP" ]; then
              echo 'ERROR: Timed out waiting for EIP association' >&2
              exit 1
            fi

            # ── Write systemd drop-in with literal EIP values ────────
            mkdir -p /etc/systemd/system/stunserver.service.d
            cat > /etc/systemd/system/stunserver.service.d/override.conf << EOF
            [Service]
            ExecStart=
            ExecStart=/usr/bin/stunserver --mode full --primaryinterface ${!IFACE0} --altinterface ${!IFACE1} --primaryadvertised ${!PRIMARY_EIP} --altadvertised ${!ALT_EIP} --protocol udp --allow-response-address-unsafe
            EOF

            # ── Start service ─────────────────────────────────────────
            systemctl daemon-reload
            systemctl enable stunserver.service
            systemctl start stunserver.service

            # ── Status endpoint: what Route 53 and this rollout both ask ─
            mkdir -p /etc/stunserver
            cat > /etc/stunserver/health.env << EOF
            STATUS_BIND=${!IP0}
            STATUS_PORT=${StatusPort}
            PRIMARY_EIP=${!PRIMARY_EIP}
            ALT_EIP=${!ALT_EIP}
            EOF
            systemctl enable --now stunserver-health.service

            # ── Wait until it reports healthy (max 5 min) ─────────────
            HEALTHY=false
            for i in $(seq 1 60); do
              if curl -fsS --max-time 3 "http://${!IP0}:${StatusPort}/" > /dev/null; then HEALTHY=true; break; fi
              sleep 5
            done
            if [ "$HEALTHY" != true ]; then
              echo 'ERROR: status endpoint never reported healthy' >&2
              exit 1
            fi

            # ── Tell CloudFormation this instance is up ───────────────
            signal SUCCESS

  # A launch template change replaces the instance: the old one stops first
  # (it holds both Elastic IPs, which the new one takes over at boot), and the
  # update only moves on once the new instance reports healthy. A new instance
  # that never does rolls the update back.
  StunASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: StunVPCGatewayAttachment
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        WaitOnResourceSignals: true
        PauseTime: PT15M
    Properties:
      AutoScalingGroupName: !Sub "stunserver-asg-${AWS::Region}"
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier:
        - !Ref StunSubnet
      LaunchTemplate:
        LaunchTemplateId: !Ref StunLaunchTemplate
        Version: !GetAtt StunLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub "stunserver-${AWS::Region}"
          PropagateAtLaunch: true
        - Key: Version
          Value: !Ref StunServerVersion
          PropagateAtLaunch: true

  StunDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "${DomainName}."
      Type: A
      TTL: "60"
      SetIdentifier: !Sub "stunserver-${AWS::Region}"
      Region: !Ref AWS::Region
      HealthCheckId: !Ref StunHealthCheck
      ResourceRecords:
        - !GetAtt EIP1.PublicIp

Outputs:
  PublicIP1:
    Description: "Primary Elastic IP (eth0) — used in DNS for the latency-routed record"
    Value: !GetAtt EIP1.PublicIp
  PublicIP2:
    Description: Alternate Elastic IP (eth1) — used by stunserver full mode
    Value: !GetAtt EIP2.PublicIp
  AutoScalingGroup:
    Description: Name of the Auto Scaling Group managing the STUN server instance
    Value: !Ref StunASG
